# Builds kbmouse.exe and publishes it:
# - push to master -> rolling "latest" prerelease (always the newest build)
# - push of a vX.Y.Z tag -> versioned release with the commit log since the previous tag
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          rustup toolchain install stable --profile minimal
          cargo build --release --locked
          cp target/release/kbmouse.exe kbmouse.exe

      - name: Publish rolling build
        if: github.ref == 'refs/heads/master'
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest kbmouse.exe --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from $GITHUB_SHA: $(git log -1 --format=%s)"

      - name: Publish version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="$GITHUB_REF_NAME"
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>/dev/null || true)
          git log --format='- %s' ${prev:+$prev..}"$tag" > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" kbmouse.exe --clobber
          else
            gh release create "$tag" kbmouse.exe --title "$tag" --notes-file notes.md
          fi
